# Gradle daemon JVM criteria.
# https://docs.gradle.org/current/userguide/gradle_daemon.html#sec:daemon_jvm_criteria
#
# Fabric Loom 1.19 requires JVM 25+ to *run* the build, so the Gradle daemon must
# be on 25+ no matter what `JAVA_HOME` / `java -version` says. The mod itself is
# still compiled to Java 17 (see `options.release` in build.gradle).
#
# Keep this in sync with the JDK in .github/workflows/build.yml.
toolchainVersion=25
